name: Apply favicon without changing website

on:
  push:
    paths:
      - '.github/workflows/trigger-pages-favicon-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Change only favicon reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<link rel="icon" href="images/favicon-circle.svg" type="image/svg+xml">'
          new = '<link rel="icon" href="images/favicon-circle.svg?v=2" type="image/svg+xml">'
          if old not in s:
              raise SystemExit('Expected favicon line not found; refusing to modify website.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/trigger-pages-favicon-fix.yml
      - name: Commit only favicon change and trigger Pages deployment
        run: |
          git config user.name 'KKA Website Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/trigger-pages-favicon-fix.yml
          git commit -m 'Refresh favicon without changing website content'
          git push
