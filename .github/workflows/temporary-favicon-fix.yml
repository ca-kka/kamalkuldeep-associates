name: Apply circular favicon

on:
  push:
    paths:
      - '.github/workflows/temporary-favicon-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore index and apply favicon reference
        run: |
          git checkout 0b747701b5fc2fc7ede2997a35fee60113460ec0 -- index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('images/ca-logo-premium.svg" type="image/png"', 'images/favicon-circle.svg" type="image/svg+xml"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit favicon reference
        run: |
          git config user.name 'KKA Website Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Use circular white-background favicon' && git push)
