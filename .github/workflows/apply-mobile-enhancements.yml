name: Apply KKA mobile enhancements

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/apply-mobile-enhancements.yml'

permissions:
  contents: write

jobs:
  apply-mobile-css:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add mobile stylesheet link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- KKA-MOBILE-ENHANCEMENTS -->'
          link = '<link rel="stylesheet" href="styles/mobile-enhancements.css">'
          if marker not in text:
              needle = '</head>'
              if needle not in text:
                  raise SystemExit('Could not find </head> in index.html')
              text = text.replace(needle, f'    {marker}\n    {link}\n</head>', 1)
              p.write_text(text, encoding='utf-8')
              print('Mobile stylesheet linked.')
          else:
              print('Mobile stylesheet already linked.')
          PY

      - name: Commit website change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Improve responsive mobile website design'
          git push
