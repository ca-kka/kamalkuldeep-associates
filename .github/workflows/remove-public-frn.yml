name: Remove Public FRN

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  remove-frn:
    if: github.event.head_commit.message != 'Remove public FRN from website'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove firm registration number from public HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          lines = text.splitlines(keepends=True)
          filtered = [
              line for line in lines
              if 'Firm Registration No:' not in line
          ]

          new_text = ''.join(filtered)

          if new_text == text:
              print('No public FRN entry found; nothing to change.')
          else:
              path.write_text(new_text, encoding='utf-8')
              print('Removed public firm registration number entries.')
          PY

      - name: Commit removal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Remove public FRN from website'
            git push
          fi
