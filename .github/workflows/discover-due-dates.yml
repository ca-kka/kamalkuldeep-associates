name: Daily due-date discovery

on:
  schedule:
    # GitHub Actions cron is UTC. Run every 6 hours.
    # Offset from the Latest Updates workflow to avoid runner contention.
    - cron: '47 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/discover_due_dates.py'
      - 'scripts/test_due_dates.py'
      - 'scripts/roll_advance_tax.py'
      - 'scripts/test_advance_tax.py'
      - 'scripts/update_site.py'
      - '.github/workflows/discover-due-dates.yml'

# Only one discovery run should be active at a time. If another trigger
# arrives while one is running, keep the active run and let the new run wait.
concurrency:
  group: due-date-discovery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    # Government sites and PDF parsing can occasionally be slow.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install official-source parsing dependencies
        run: python -m pip install --disable-pip-version-check pypdf

      - name: Regression-test calendar rollovers
        run: |
          python3 scripts/test_due_dates.py
          python3 scripts/test_advance_tax.py

      - name: Check official sources and calculate recurring due dates
        run: python3 scripts/discover_due_dates.py

      - name: Calculate advance tax dates from the current date
        run: python3 scripts/roll_advance_tax.py

      - name: Rebuild website only when due-date data changed
        run: python3 scripts/update_site.py

      - name: Publish due-date changes
        run: |
          git config user.name 'KKA Due Date Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/due-dates.json index.html
          if git diff --cached --quiet; then
            echo 'No due-date change. Public website remains unchanged.'
          else
            git commit -m 'Auto-update verified due-date change'
            git push
          fi
