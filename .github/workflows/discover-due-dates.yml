name: Daily due-date discovery

on:
  schedule:
    # GitHub Actions cron is UTC. 18:30 UTC = 00:00 IST (next day).
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run official-source discovery
        run: python3 scripts/discover_due_dates.py

      - name: Commit discovery report
        run: |
          git config user.name 'KKA Due Date Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/due-date-discovery.json
          if git diff --cached --quiet; then
            echo 'No discovery report changes.'
          else
            git commit -m 'Daily due-date source discovery'
            git push
          fi
