name: Apply KKA mobile styling

on:
  push:
    paths:
      - 'styles/mobile-enhancements.css'
      - '.github/workflows/mobile-css.yml'

permissions:
  contents: write

jobs:
  apply-mobile-css:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Link mobile stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="styles/mobile-enhancements.css?v=20260814">'
          if link not in text:
              marker = '</head>'
              if marker not in text:
                  raise SystemExit('Could not find </head> in index.html')
              text = text.replace(marker, '    ' + link + '\n' + marker, 1)
              p.write_text(text, encoding='utf-8')
              print('Mobile stylesheet linked.')
          else:
              print('Mobile stylesheet already linked.')
          PY

      - name: Commit index.html
        run: |
          git config user.name 'KKA Website Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index.html changes required.'
          else
            git commit -m 'Enable responsive mobile styling'
            git push
          fi
