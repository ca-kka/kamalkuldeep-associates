name: Apply KKA mobile styling

on:
  push:
    paths:
      - 'styles/mobile-enhancements.css'
      - 'styles/mobile-hamburger.css'
      - 'styles/premium-branding.css'
      - '.github/workflows/mobile-css.yml'

permissions:
  contents: write

jobs:
  apply-mobile-css:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Link mobile and premium stylesheets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          links = [
              '<link rel="stylesheet" href="styles/mobile-enhancements.css?v=20260814-3">',
              '<link rel="stylesheet" href="styles/mobile-hamburger.css?v=20260814-2">',
              '<link rel="stylesheet" href="styles/premium-branding.css?v=20260814-1">'
          ]
          marker = '</head>'
          if marker not in text:
              raise SystemExit('Could not find </head> in index.html')
          changed = False
          for link in links:
              href = link.split('href="', 1)[1].split('"', 1)[0]
              if href not in text:
                  text = text.replace(marker, '    ' + link + '\n' + marker, 1)
                  changed = True

          # Use the premium framed asset wherever the site's CA logo source is used.
          old = 'images/ca-logo.png'
          new = 'images/ca-logo-premium.svg'
          if old in text:
              text = text.replace(old, new)
              changed = True

          if changed:
              p.write_text(text, encoding='utf-8')
              print('Premium branding linked and logo source updated.')
          else:
              print('Premium branding already applied.')
          PY

      - name: Commit index.html
        run: |
          git config user.name 'KKA Website Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index.html changes required.'
          else
            git commit -m 'Apply premium logo and branding'
            git push
          fi
