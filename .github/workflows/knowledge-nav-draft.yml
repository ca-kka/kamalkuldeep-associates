name: Knowledge Centre navigation

on:
  push:
    branches: [main, knowledge-centre-phase1]
    paths: ['index.html','scripts/add-knowledge-nav.py','.github/workflows/knowledge-nav-draft.yml']

permissions:
  contents: write

jobs:
  patch-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Knowledge Centre link safely
        run: python3 scripts/add-knowledge-nav.py
      - name: Commit navigation change
        run: |
          if git diff --quiet; then
            echo 'Knowledge Centre navigation already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Knowledge Centre to main navigation'
          git push
