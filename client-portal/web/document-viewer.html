<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>KKA Document</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f5f6f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{display:grid;place-items:center;color:#222}
#status{padding:24px;text-align:center;max-width:560px}
.muted{color:#666;margin:8px 0 0}
#status button{margin-top:16px;padding:10px 16px;border:1px solid #355c49;border-radius:8px;background:#355c49;color:#fff;font:inherit;cursor:pointer}
iframe{border:0;width:100%;height:100%;display:block}
img{display:block;max-width:100%;max-height:100vh;object-fit:contain;margin:auto}
</style>
</head>
<body>
<div id="status"><strong>Opening document…</strong><p class="muted">Please wait.</p></div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./config.js";
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const status=document.getElementById("status");
const id=new URLSearchParams(location.search).get("documentId");
function message(text){status.textContent=text}
async function requestWithSession(endpoint,init={}){
  const current=await supabase.auth.getSession();
  let token=current.data.session?.access_token;
  if(!token)throw new Error("Your KKA session has expired. Please sign in again.");
  const send=accessToken=>fetch(endpoint,{...init,headers:{...(init.headers||{}),Authorization:"Bearer "+accessToken,apikey:SUPABASE_PUBLISHABLE_KEY}});
  let response=await send(token);
  if(response.status===401||response.status===403){
    const refreshed=await supabase.auth.refreshSession();
    token=refreshed.data.session?.access_token;
    if(token)response=await send(token);
  }
  return response;
}
function filenameFrom(response){
  const header=response.headers.get("Content-Disposition")||"";
  const utf8=header.match(/filename\*=UTF-8''([^;]+)/i);
  if(utf8){try{return decodeURIComponent(utf8[1])}catch{}}
  return header.match(/filename="([^"]+)"/i)?.[1]||"KKA document";
}
async function downloadDocument(){
  if(!id)throw new Error("Document ID is missing.");
  const response=await requestWithSession(SUPABASE_URL+"/functions/v1/client-document-access",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({documentId:id,action:"download_stream"})
  });
  if(!response.ok){const result=await response.json().catch(()=>({}));throw new Error(result.error||"The document could not be downloaded.");}
  const blob=await response.blob();
  if(!blob.size)throw new Error("The document download was empty.");
  const url=URL.createObjectURL(blob),link=document.createElement("a");
  link.href=url;link.download=filenameFrom(response);document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),120000);
  message("Download started. This page remains in the KKA portal.");
}
function offerDownload(text){
  status.replaceChildren();
  const heading=document.createElement("strong");heading.textContent=text;
  const detail=document.createElement("p");detail.className="muted";detail.textContent="You can download it securely from the KKA portal.";
  const button=document.createElement("button");button.type="button";button.textContent="Download document";
  button.addEventListener("click",()=>downloadDocument().catch(error=>message(error instanceof Error?error.message:"The document could not be downloaded.")));
  status.append(heading,detail,button);
}
async function openDocument(){
  if(!id){message("Document ID is missing.");return}
  const endpoint=SUPABASE_URL+"/functions/v1/document-view?documentId="+encodeURIComponent(id);
  const response=await requestWithSession(endpoint);
  if(response.status===415){offerDownload("Preview is not available for this file type.");return}
  if(!response.ok){message(await response.text().catch(()=>"")||("The document could not be opened (HTTP "+response.status+")."));return}
  const bytes=await response.arrayBuffer();
  if(bytes.byteLength<3){message("The document response was empty.");return}
  const probe=new Uint8Array(bytes.slice(0,Math.min(bytes.byteLength,1024)));
  let pdf=false;
  for(let i=0;i<=probe.length-5;i++)if(probe[i]===37&&probe[i+1]===80&&probe[i+2]===68&&probe[i+3]===70&&probe[i+4]===45){pdf=true;break}
  const type=(response.headers.get("Content-Type")||"").split(";")[0].toLowerCase();
  const jpeg=type==="image/jpeg"&&probe[0]===255&&probe[1]===216&&probe[2]===255;
  const png=type==="image/png"&&probe.length>=8&&probe[0]===137&&probe[1]===80&&probe[2]===78&&probe[3]===71&&probe[4]===13&&probe[5]===10&&probe[6]===26&&probe[7]===10;
  if(!(pdf&&type==="application/pdf")&&!jpeg&&!png){offerDownload("This file cannot be previewed in the portal.");return}
  const url=URL.createObjectURL(new Blob([bytes],{type}));
  document.title=filenameFrom(response);
  document.body.innerHTML=pdf?"<iframe title=\"KKA Document\" src=\""+url+"\"></iframe>":"<img alt=\"KKA document\" src=\""+url+"\">";
}
openDocument().catch(error=>message(error instanceof Error?error.message:"The document could not be opened."));
</script>
</body>
</html>
