<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>KKA Knowledge Centre — Article Editor</title><link rel="stylesheet" href="admin.css"></head><body><main class="shell"><header class="adminbar"><div><a class="back" href="dashboard.html">← Dashboard</a><p class="eyebrow">ARTICLE EDITOR</p></div></header><form class="editor" id="editor"><label>Title<input id="title" required placeholder="Article title"></label><label>Slug<input id="slug" required placeholder="article-url-slug"></label><div class="two"><label>Category<select><option>GST</option><option>Income Tax</option><option>TDS / TCS</option><option>MCA</option><option>Audit & Accounting</option><option>FEMA / RBI</option><option>SEBI</option><option>Case Laws</option><option>Compliance</option><option>Practical Guides</option><option>FAQs</option></select></label><label>Author<input placeholder="Author ID"></label></div><label>Executive Summary<textarea rows="4" placeholder="Concise summary"></textarea></label><label>Content<textarea rows="16" placeholder="Rich-text editor will be connected to the publishing API here."></textarea></label><div class="two"><label>SEO Title<input></label><label>Meta Description<input></label></div><label>Tags<input placeholder="gst, notification, compliance"></label><div class="actions"><button type="button">Save Draft</button><button type="button">Preview</button><button type="button">Submit for Review</button><button type="button">Publish</button></div></form><p class="security">Publishing controls are intentionally non-functional in this static draft. Production publishing must require authenticated server-side authorization and audit logging.</p></main></body></html>
