<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="KKA Knowledge Centre article"><meta name="robots" content="index,follow"><title>KKA Knowledge Centre — Article</title><link rel="icon" href="../images/favicon-circle.svg"><link rel="stylesheet" href="css/knowledge.css"></head><body><header class="kc-header"><div class="wrap topbar"><a class="back" href="./">← Knowledge Centre</a><div class="topbar-actions"><a class="back" href="../">KKA Main Website →</a><a class="admin-button" href="admin/">Admin</a></div></div><div class="wrap hero"><p id="category" class="kicker">KKA INSIGHTS</p><h1 id="title">Article</h1><p id="meta" class="hero-copy"></p></div></header><main class="wrap main"><article id="content" class="article-body" style="max-width:850px;margin:auto;background:#fff;border:1px solid #e4e9f1;border-radius:14px;padding:28px"></article></main><footer class="kc-footer"><div class="wrap footer-inner"><strong>KKA Knowledge Centre</strong><a href="./">← All Knowledge</a></div></footer><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const slug=new URLSearchParams(location.search).get('slug');fetch('data/articles.json').then(r=>r.json()).then(d=>{const a=(d.items||[]).find(x=>x.status==='published'&&x.slug===slug)||d.items?.[0];if(!a)throw Error('not found');document.title=`${a.title} | KKA Knowledge Centre`;document.getElementById('category').textContent=a.category;document.getElementById('title').textContent=a.title;document.getElementById('meta').textContent=`${a.author} · Published ${new Date(a.publishedAt+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})} · Updated ${new Date(a.updatedAt+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}`;document.getElementById('content').innerHTML=`<p><strong>Executive Summary</strong></p><p>${esc(a.summary)}</p><hr><p>${esc(a.content)}</p><p><strong>Tags</strong></p><p>${(a.tags||[]).map(esc).join(' · ')}</p>`}).catch(()=>{document.getElementById('title').textContent='Article not found';document.getElementById('content').textContent='This article is not available.'});</script></body></html>
