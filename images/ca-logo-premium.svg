<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Kamal Kuldeep & Associates logo">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0b1f3a" flood-opacity="0.20"/>
    </filter>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f7fb"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="38" fill="url(#frame)" filter="url(#shadow)"/>
  <rect x="13.5" y="13.5" width="229" height="229" rx="36.5" fill="none" stroke="#d9e2ef" stroke-width="3"/>
  <image href="ca-logo.png" x="42" y="42" width="172" height="172" preserveAspectRatio="xMidYMid meet"/>
</svg>
